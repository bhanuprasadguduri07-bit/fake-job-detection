{% extends "base.html" %}

{% block title %}Log In - Fake Job Detection{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="glass-card p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="brand-icon d-inline-block fs-3 p-3 mb-3">
            <i class="bi bi-shield-lock"></i>
          </div>
          <h2 class="fw-bold text-white mb-2">Sign In to <span class="cooper-highlight">Dashboard</span></h2>
          <p class="small mb-0" style="color: var(--text-muted);">
            Access enterprise fraud detection, real-time monitoring telemetry, and automated alerts.
          </p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
          <div class="mb-3">
            <label for="login_id" class="form-label fw-semibold text-light">Username or Email</label>
            <div class="input-group">
              <span class="input-group-text border-secondary border-opacity-25" style="background: rgba(13, 21, 44, 0.8); color: var(--neon-cyan);">
                <i class="bi bi-person"></i>
              </span>
              <input type="text" class="form-control" id="login_id" name="login_id" required autofocus placeholder="Enter your username or email">
            </div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label fw-semibold text-light">Password</label>
            <div class="input-group">
              <span class="input-group-text border-secondary border-opacity-25" style="background: rgba(13, 21, 44, 0.8); color: var(--neon-cyan);">
                <i class="bi bi-key"></i>
              </span>
              <input type="password" class="form-control" id="password" name="password" required placeholder="Enter your password">
            </div>
          </div>

          <button type="submit" class="btn btn-primary-gradient w-100 py-2 fw-semibold shadow-sm">
            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In to Dashboard
          </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
          <p class="small mb-0" style="color: var(--text-muted);">
            Don't have an account? <a href="{{ url_for('register') }}" class="fw-semibold text-cyan text-decoration-none">Create Free Account &rarr;</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
