{% extends "base.html" %}

{% block title %}Create Account - Fake Job Detection{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="glass-card p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="brand-icon d-inline-block fs-3 p-3 mb-3">
            <i class="bi bi-person-plus"></i>
          </div>
          <h2 class="fw-bold text-white mb-2">Create <span class="cooper-highlight">Free Account</span></h2>
          <p class="small mb-0" style="color: var(--text-muted);">
            Register for automated 24-hour job portal monitoring, custom risk alerts, and detection history.
          </p>
        </div>

        <form method="POST" action="{{ url_for('register') }}">
          <div class="mb-3">
            <label for="full_name" class="form-label fw-semibold text-light">Full Name</label>
            <input type="text" class="form-control" id="full_name" name="full_name" placeholder="John Doe">
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="username" class="form-label fw-semibold text-light">Username <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="username" name="username" required placeholder="johndoe">
            </div>
            <div class="col-md-6">
              <label for="email" class="form-label fw-semibold text-light">Email Address <span class="text-danger">*</span></label>
              <input type="email" class="form-control" id="email" name="email" required placeholder="john@example.com">
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label for="password" class="form-label fw-semibold text-light">Password <span class="text-danger">*</span></label>
              <input type="password" class="form-control" id="password" name="password" minlength="6" required placeholder="Min 6 characters">
            </div>
            <div class="col-md-6">
              <label for="confirm_password" class="form-label fw-semibold text-light">Confirm Password <span class="text-danger">*</span></label>
              <input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="6" required placeholder="Repeat password">
            </div>
          </div>

          <button type="submit" class="btn btn-primary-gradient w-100 py-2 fw-semibold shadow-sm">
            <i class="bi bi-stars me-2"></i>Create Free Account
          </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
          <p class="small mb-0" style="color: var(--text-muted);">
            Already have an account? <a href="{{ url_for('login') }}" class="fw-semibold text-cyan text-decoration-none">Sign in here &rarr;</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
